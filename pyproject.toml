[project]
name = "visual-recommendations-mvp"
version = "0.1.0"
description = "Minimal asynchronous visual recommendations service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pillow>=11,<12",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=2.3.1",
    "pytest>=8.3,<9",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/app"]
python_version = "3.11"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_api: opt-in test that makes paid OpenAI API calls",
]
