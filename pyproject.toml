[project]
name = "visual-recommendations-mvp"
version = "0.1.0"
description = "Minimal asynchronous visual recommendations service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pillow>=11,<12",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_api: opt-in test that makes paid OpenAI API calls",
]
