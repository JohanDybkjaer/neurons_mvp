# Models used by the two AI roles and the timeout applied to each provider call.
[providers]
image_editor_model = "gpt-image-2"
evaluator_model = "gpt-5.6"
timeout_seconds = 120

# Upload and iteration limits. The initial generation and evaluation count as
# iteration 1; use 1 to disable repairs. The workflow enforces five in code.
[limits]
max_image_size_mb = 10
max_iterations = 1

# Keep routine success logs quiet in the deployed test environment.
[logging]
level = "WARNING"

# Isolated artifact storage for a deployed test instance.
[storage]
artifact_root = "runtime/test-tasks"
