# Models used by the two AI roles and the timeout applied to each provider call.
[providers]
image_editor_model = "gpt-image-2"
evaluator_model = "gpt-5.6-terra"
timeout_seconds = 120

# Upload and iteration limits. The initial generation and evaluation count as
# iteration 1; use 1 to disable repairs. The workflow enforces five in code.
[limits]
max_image_size_mb = 10
max_iterations = 2

# Application log verbosity; logs are written to stdout and runtime/logs/app.log.
[logging]
level = "DEBUG"

# Server-managed originals and generated variants, relative to the working directory.
[storage]
artifact_root = "runtime/tasks"
